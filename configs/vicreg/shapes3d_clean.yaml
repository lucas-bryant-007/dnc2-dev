# 3DShapes CLEAN cube: object colour / shape / size, with the two background hues
# HELD FIXED so object colour is not entangled with floor/wall colour. This makes
# all three axes well-captured -> a clean cube (the resampled-background version in
# shapes3d.yaml keeps object colour soft, B=0.55, which is the honest "capture
# varies" data point -- both are kept on purpose).
exp_name: resnet18_vicreg_shapes3d_clean
seed: 6

data:
  name: shapes3d
  h5_path: ${oc.env:SHAPES3D_H5,./data/shapes3d/3dshapes.h5}
  img_size: 64
  batch_size: 512
  num_workers: 16
  num_views: 2
  task_factors: ["object_hue", "shape", "scale"]
  shapes: [0, 1, 2, 3]
  object_hue_threshold: 5
  shape_threshold: 2
  scale_threshold: 4
  # Fix floor + wall hue (single value) -> object colour is the only colour that
  # varies, so it is cleanly recoverable. Nuisance = orientation only.
  keep_levels:
    object_hue: [0, 1, 2, 7, 8, 9]
    scale: [0, 1, 6, 7]
    floor_hue: [0]
    wall_hue: [0]
  pair_mode: exact
  max_samples: 200000

model:
  resnet_name: "resnet18"
  pretrained: false
  lr: 3.0e-4
  weight_decay: 1e-6
  warmup_epochs: 5
  min_lr: 0.0002
  lambda_param: 25.0
  mu_param: 25.0
  nu_param: 1.0
  hidden_dim: 1024
  output_dim: 1024
  num_layers: 2

trainer:
  devices: 1
  accelerator: gpu
  strategy: auto
  max_epochs: 201          # fewer images (backgrounds fixed) -> train longer
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  num_sanity_val_steps: 0
  log_every_n_steps: 50

method:
  name: "vicreg"

logging:
  backend: csv
  project: dnc
  entity: null
  run_name: vicreg_shapes3d_clean
  tags: ["vicreg", "shapes3d", "clean"]
  log_model: false
  log_every_n_steps: 50

precision: bf16-mixed

paths:
  output_root: ${oc.env:OUTPUT_ROOT,./checkpoints}
  exp_dir: ${oc.env:EXP_DIR,null}
  resume_from_checkpoint: ${oc.env:RESUME_FROM_CHECKPOINT,null}

ckpt_schedule:
  dirpath: "checkpoints/vicreg_shapes3d_clean"
  early_every: 5
  early_until: 40
  late_every: 20
  save_last: true

probe:
  enabled: False
  every_n_epochs: 500
  max_epochs: 100
  lr: 0.1
  weight_decay: 1e-6
  batch_size: 256

cdnv:
  every_n_epochs: 20
  num_classes: 2
  enabled: False
