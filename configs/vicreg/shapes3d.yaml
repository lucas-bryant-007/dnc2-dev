# 3DShapes (Shapes3D) hyper-rectangle run -- a second dataset for the box/bounds/
# spectrum/interference drivers. Semantic axes: object colour / shape / size.
exp_name: resnet18_vicreg_shapes3d
seed: 6

data:
  name: shapes3d
  # Standard 3dshapes.h5 (keys: 'images' [480000,64,64,3] uint8, 'labels' [480000,6]).
  # Download once from the DeepMind 3D Shapes dataset; then:
  #   export SHAPES3D_H5=$PWD/data/shapes3d/3dshapes.h5
  h5_path: ${oc.env:SHAPES3D_H5,./data/shapes3d/3dshapes.h5}
  img_size: 64
  batch_size: 512
  num_workers: 16
  num_views: 2
  # Tasks: object colour / shape / size -- salient, independent -> clean box.
  task_factors: ["object_hue", "shape", "scale"]
  shapes: [0, 1, 2, 3]              # keep all 4 shape categories
  object_hue_threshold: 5           # object_hue index >= 5 -> "warm"
  shape_threshold: 2                # {cube,cylinder} vs {sphere,capsule}
  scale_threshold: 4                # scale index >= 4 -> "large"
  # Keep only extreme levels of the continuous factors (drop ambiguous middle) ->
  # crisp, well-separated binary tasks and a clean box (shape is already discrete).
  keep_levels:
    object_hue: [0, 1, 2, 7, 8, 9]
    scale: [0, 1, 6, 7]
  pair_mode: exact                  # positives share EXACT object_hue/shape/scale;
                                    # floor/wall hue + orientation resampled (nuisance)
  max_samples: 200000

model:
  resnet_name: "resnet18"
  pretrained: false
  lr: 3.0e-4
  weight_decay: 1e-6
  warmup_epochs: 5
  min_lr: 0.0002
  lambda_param: 25.0
  mu_param: 25.0
  nu_param: 1.0
  hidden_dim: 1024
  output_dim: 1024
  num_layers: 2

trainer:
  devices: 1
  accelerator: gpu
  strategy: auto
  max_epochs: 81
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  num_sanity_val_steps: 0
  log_every_n_steps: 50

method:
  name: "vicreg"

logging:
  backend: csv
  project: dnc
  entity: null
  run_name: vicreg_shapes3d
  tags: ["vicreg", "shapes3d"]
  log_model: false
  log_every_n_steps: 50

precision: bf16-mixed

paths:
  output_root: ${oc.env:OUTPUT_ROOT,./checkpoints}
  exp_dir: ${oc.env:EXP_DIR,null}
  resume_from_checkpoint: ${oc.env:RESUME_FROM_CHECKPOINT,null}

ckpt_schedule:
  dirpath: "checkpoints/vicreg_shapes3d"
  early_every: 5
  early_until: 40
  late_every: 20
  save_last: true

probe:
  enabled: False
  every_n_epochs: 500
  max_epochs: 100
  lr: 0.1
  weight_decay: 1e-6
  batch_size: 256

cdnv:
  every_n_epochs: 20
  num_classes: 2
  enabled: False
