# 3DShapes WIDE: positive pairs share FIVE factors (floor/wall/object colour,
# scale, shape) and differ only in orientation. The encoder must preserve all five
# to spread samples, so a diverse task family of those five factors needs ~5
# independent bottleneck dimensions -> a richer interference curve than the 3-factor
# runs (a task family that needs a few more independent dimensions).
exp_name: resnet18_vicreg_shapes3d_wide
seed: 6

data:
  name: shapes3d
  h5_path: ${oc.env:SHAPES3D_H5,./data/shapes3d/3dshapes.h5}
  img_size: 64
  batch_size: 512
  num_workers: 16
  num_views: 2
  # task_factors still names 3 (used only for the 3-bit derive); the PAIRING uses
  # content_factors below.
  task_factors: ["object_hue", "shape", "scale"]
  content_factors: ["floor_hue", "wall_hue", "object_hue", "scale", "shape"]
  shapes: [0, 1, 2, 3]
  floor_hue_threshold: 5
  wall_hue_threshold: 5
  object_hue_threshold: 5
  scale_threshold: 4
  shape_threshold: 2
  # Extreme levels of the 3 hues + scale -> crisp binary tasks; orientation (the
  # only nuisance) and shape kept full. ~51,840 images, 15 orientations / group.
  keep_levels:
    floor_hue: [0, 1, 2, 7, 8, 9]
    wall_hue: [0, 1, 2, 7, 8, 9]
    object_hue: [0, 1, 2, 7, 8, 9]
    scale: [0, 1, 6, 7]
  pair_mode: exact            # shares exact content_factors; orientation resampled
  max_samples: null           # use all ~51,840

model:
  resnet_name: "resnet18"
  pretrained: false
  lr: 3.0e-4
  weight_decay: 1e-6
  warmup_epochs: 5
  min_lr: 0.0002
  lambda_param: 25.0
  mu_param: 25.0
  nu_param: 1.0
  hidden_dim: 1024
  output_dim: 1024
  num_layers: 2

trainer:
  devices: 1
  accelerator: gpu
  strategy: auto
  max_epochs: 400          # long run: push all 5 factors to high B + tight orthogonality
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  num_sanity_val_steps: 0
  log_every_n_steps: 50

method:
  name: "vicreg"

logging:
  backend: csv
  project: dnc
  entity: null
  run_name: vicreg_shapes3d_wide
  tags: ["vicreg", "shapes3d", "wide"]
  log_model: false
  log_every_n_steps: 50

precision: bf16-mixed

paths:
  output_root: ${oc.env:OUTPUT_ROOT,./checkpoints}
  exp_dir: ${oc.env:EXP_DIR,null}
  resume_from_checkpoint: ${oc.env:RESUME_FROM_CHECKPOINT,null}

ckpt_schedule:
  dirpath: "checkpoints/vicreg_shapes3d_wide"
  early_every: 5
  early_until: 40
  late_every: 50         # save 50,100,...,400 -> pick the cleanest late epoch
  save_last: true

probe:
  enabled: False
  every_n_epochs: 500
  max_epochs: 100
  lr: 0.1
  weight_decay: 1e-6
  batch_size: 256

cdnv:
  every_n_epochs: 20
  num_classes: 2
  enabled: False
