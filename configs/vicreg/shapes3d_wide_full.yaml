# 3DShapes WIDE on the FULL dataset (no keep_levels, all 480k images) -- the
# honesty/robustness check for shapes3d_wide.yaml. Binary tasks are now defined on
# the full factor range (e.g. hue>=5 over all 10 hues), so per-task accuracy will be
# a touch lower (borderline levels), but if the diverse family still needs ~5
# dimensions and the axes stay orthogonal, the result isn't an artifact of the
# extreme-level subset.
exp_name: resnet18_vicreg_shapes3d_wide_full
seed: 6

data:
  name: shapes3d
  h5_path: ${oc.env:SHAPES3D_H5,./data/shapes3d/3dshapes.h5}
  img_size: 64
  batch_size: 512
  num_workers: 16
  num_views: 2
  task_factors: ["object_hue", "shape", "scale"]
  content_factors: ["floor_hue", "wall_hue", "object_hue", "scale", "shape"]
  shapes: [0, 1, 2, 3]
  floor_hue_threshold: 5
  wall_hue_threshold: 5
  object_hue_threshold: 5
  scale_threshold: 4
  shape_threshold: 2
  keep_levels: null          # <- ALL levels, no subset (480k images)
  pair_mode: exact           # shares exact content_factors; orientation resampled
  max_samples: null          # use everything

model:
  resnet_name: "resnet18"
  pretrained: false
  lr: 3.0e-4
  weight_decay: 1e-6
  warmup_epochs: 5
  min_lr: 0.0002
  lambda_param: 25.0
  mu_param: 25.0
  nu_param: 1.0
  hidden_dim: 1024
  output_dim: 1024
  num_layers: 2

trainer:
  devices: 1
  accelerator: gpu
  strategy: auto
  max_epochs: 121          # full data -> ~10x samples/epoch, so fewer epochs needed
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  num_sanity_val_steps: 0
  log_every_n_steps: 50

method:
  name: "vicreg"

logging:
  backend: csv
  project: dnc
  entity: null
  run_name: vicreg_shapes3d_wide_full
  tags: ["vicreg", "shapes3d", "wide", "fulldata"]
  log_model: false
  log_every_n_steps: 50

precision: bf16-mixed

paths:
  output_root: ${oc.env:OUTPUT_ROOT,./checkpoints}
  exp_dir: ${oc.env:EXP_DIR,null}
  resume_from_checkpoint: ${oc.env:RESUME_FROM_CHECKPOINT,null}

ckpt_schedule:
  dirpath: "checkpoints/vicreg_shapes3d_wide_full"
  early_every: 5
  early_until: 40
  late_every: 20
  save_last: true

probe:
  enabled: False
  every_n_epochs: 500
  max_epochs: 100
  lr: 0.1
  weight_decay: 1e-6
  batch_size: 256

cdnv:
  every_n_epochs: 20
  num_classes: 2
  enabled: False
