# 3DShapes WIDE-4: share FOUR factors of DISTINCT modalities -- object colour,
# size, shape, pose (orientation) -- and resample the two BACKGROUND hues as the
# nuisance. Unlike shapes3d_wide.yaml (which shares 3 colours that entangle in a
# global-pooled ResNet), these four are different "types" of factor, so the encoder
# should give each its own direction -> a clean ~4-dimensional diverse family.
exp_name: resnet18_vicreg_shapes3d_wide4
seed: 6

data:
  name: shapes3d
  h5_path: ${oc.env:SHAPES3D_H5,./data/shapes3d/3dshapes.h5}
  img_size: 64
  batch_size: 512
  num_workers: 16
  num_views: 2
  task_factors: ["object_hue", "shape", "scale"]
  content_factors: ["object_hue", "scale", "shape", "orientation"]
  shapes: [0, 1, 2, 3]
  object_hue_threshold: 5
  scale_threshold: 4
  shape_threshold: 2
  orient_threshold: 7
  # extreme object hue + scale for crisp tasks; shape + orientation kept full
  # (orientation is content here); floor/wall hue kept full = the nuisance.
  keep_levels:
    object_hue: [0, 1, 2, 7, 8, 9]
    scale: [0, 1, 6, 7]
  pair_mode: exact            # shares object_hue/scale/shape/orientation; backgrounds resampled
  max_samples: null

model:
  resnet_name: "resnet18"
  pretrained: false
  lr: 3.0e-4
  weight_decay: 1e-6
  warmup_epochs: 5
  min_lr: 0.0002
  lambda_param: 25.0
  mu_param: 25.0
  nu_param: 1.0
  hidden_dim: 1024
  output_dim: 1024
  num_layers: 2

trainer:
  devices: 1
  accelerator: gpu
  strategy: auto
  max_epochs: 300          # give pose time to come in
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  num_sanity_val_steps: 0
  log_every_n_steps: 50

method:
  name: "vicreg"

logging:
  backend: csv
  project: dnc
  entity: null
  run_name: vicreg_shapes3d_wide4
  tags: ["vicreg", "shapes3d", "wide4"]
  log_model: false
  log_every_n_steps: 50

precision: bf16-mixed

paths:
  output_root: ${oc.env:OUTPUT_ROOT,./checkpoints}
  exp_dir: ${oc.env:EXP_DIR,null}
  resume_from_checkpoint: ${oc.env:RESUME_FROM_CHECKPOINT,null}

ckpt_schedule:
  dirpath: "checkpoints/vicreg_shapes3d_wide4"
  early_every: 5
  early_until: 40
  late_every: 50
  save_last: true

probe:
  enabled: False
  every_n_epochs: 500
  max_epochs: 100
  lr: 0.1
  weight_decay: 1e-6
  batch_size: 256

cdnv:
  every_n_epochs: 20
  num_classes: 2
  enabled: False
