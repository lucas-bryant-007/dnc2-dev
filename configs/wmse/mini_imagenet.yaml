# Experiment name and seed
exp_name: resnet50_wmse
seed: 123

# Data configuration
data:
  name: mini_imagenet
  hf_repo: timm/mini-imagenet
  hf_cache_dir: ${oc.env:HF_DATASETS_CACHE,~/.cache/huggingface/datasets}
  img_size: 224
  batch_size: 1024
  num_workers: 8
  num_views: 2
  train_split: train
  test_split: test

# Model configuration
model:
  resnet_name: "resnet50"
  pretrained: false
  lr: 0.2         # Base learning rate (will be scaled)
  weight_decay: 1e-6
  warmup_epochs: 10
  min_lr: 0.002
  # WMSE specific parameters
  slice_size: 512
  gather_distributed: false
  eps: 1e-4
  hidden_dim: 2048
  output_dim: 128
  num_layers: 2

# Training configuration
trainer:
  devices: 1
  accelerator: gpu
  strategy: auto
  max_epochs: 2001
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  num_sanity_val_steps: 0
  log_every_n_steps: 50

# Method configuration
method:
  name: "wmse"

# Logging configuration
logging:
  backend: csv              # options: "csv", "wandb"
  project: dnc
  entity: null                  # set if you use a team
  run_name: wmse_r50_v2
  tags: ["wmse"]
  log_model: false              # true if you want checkpoints uploaded
  log_every_n_steps: 25

# Precision configuration
precision: bf16-mixed           # change to "16-mixed" if bf16 isn't supported

# Paths configuration
paths:
  output_root: ${oc.env:OUTPUT_ROOT,./checkpoints}
  exp_dir: ${oc.env:EXP_DIR,null}  # set this to override, otherwise will be computed as output_root/exp_name
  resume_from_checkpoint: ${oc.env:RESUME_FROM_CHECKPOINT,null}  # set this env var to resume from a checkpoint

# Checkpoint scheduling configuration
ckpt_schedule:
  dirpath: "checkpoints/wmse_r50"  # will be set to exp_dir/checkpoints in train.py if not provided
  early_every: 10     # save every 10 epochs...
  early_until: 100    # ...up to epoch 100 (inclusive)
  late_every: 100     # then save every 100 epochs afterwards
  save_last: true

# Linear probe callback configuration
probe:
  enabled: True
  run_before_training: False
  every_n_epochs: 50
  max_epochs: 100             # probe training epochs (keep small)
  lr: 0.1
  weight_decay: 1e-6
  batch_size: 256

# CDNV callback configuration
cdnv:
  every_n_epochs: 25
  num_classes: 100
  enabled: true
